<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Lab2</title>
</head>
<body>
 
<header>
  <img src="images/logo3.png" alt="МосПолитех" height="60">
  <h2 style="text-align:center">Форма обратной связи</h2>
</header>
 
<hr>
 
<main>
  <form action="https://httpbin.org/post" method="POST">
 
    <p>
      <label>Имя пользователя:<br>
        <input type="text" name="username" required>
      </label>
    </p>
 
    <p>
      <label>E-mail:<br>
        <input type="email" name="email" required>
      </label>
    </p>
 
    <p>
      <label>Тип обращения:<br>
        <select name="appeal_type">
          <option value="complaint">Жалоба</option>
          <option value="suggestion">Предложение</option>
          <option value="gratitude">Благодарность</option>
        </select>
      </label>
    </p>
 
    <p>
      <label>Текст обращения:<br>
        <textarea name="message" rows="5" cols="40"></textarea>
      </label>
    </p>
 
    <p>Вариант ответа:</p>
    <p>
      <label><input type="checkbox" name="reply" value="sms"> СМС</label><br>
      <label><input type="checkbox" name="reply" value="email"> E-mail</label>
    </p>
 
    <p>
      <button type="submit">Отправить</button>
    </p>
 
  </form>
 
  <p><a href="page2.php">Перейти на страницу 2</a></p>
</main>
 
<hr>
 
<footer>
  <p>Задание для самостоятельной работы: Feedback Form</p>
</footer>
 
</body>
</html>
